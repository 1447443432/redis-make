name: Cleanup Build Redis runs

on:
  workflow_run:
    workflows:
      - Build Redis
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep latest successful Build Redis run
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Build Redis runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPOSITORY="${GITHUB_REPOSITORY}"
          WORKFLOW_ID="$(gh api "repos/${REPOSITORY}/actions/workflows" --paginate --jq '.workflows[] | select(.name == "Build Redis") | .id' | sed -n '1p')"
          test -n "${WORKFLOW_ID}"

          LATEST_SUCCESS="$(gh api --paginate \
            "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | [.id, .created_at] | @tsv' \
            | sort -k2,2r | sed -n '1p' | cut -f1)"
          test -n "${LATEST_SUCCESS}"

          echo "Keeping latest successful Build Redis run: ${LATEST_SUCCESS}"
          DELETED=0
          while IFS= read -r RUN_ID; do
            [ -n "${RUN_ID}" ] || continue
            if [ "${RUN_ID}" = "${LATEST_SUCCESS}" ]; then
              continue
            fi
            echo "Deleting completed Build Redis run: ${RUN_ID}"
            gh api --method DELETE "repos/${REPOSITORY}/actions/runs/${RUN_ID}"
            DELETED=$((DELETED + 1))
          done < <(gh api --paginate \
            "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id')

          {
            echo "## Actions cleanup"
            echo
            echo "- Workflow: \`Build Redis\`"
            echo "- Kept latest successful run: \`${LATEST_SUCCESS}\`"
            echo "- Deleted older completed runs: \`${DELETED}\`"
            echo "- Release assets were not modified."
          } >>"${GITHUB_STEP_SUMMARY}"

